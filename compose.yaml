services:
  starryeyes:
    build: .
    ports: ["${HOST_PORT:-8080}:8080"]
    environment:
      DATA_DIR: /var/lib/starryeyes
      OUTPUT_DIR: /mnt/output
      SPOOL_CAPACITY_BYTES: ${SPOOL_CAPACITY_BYTES:-21474836480}
      CHUNK_SIZE_BYTES: ${CHUNK_SIZE_BYTES:-67108864}
      MAX_ACTIVE_TRANSCODES: ${MAX_ACTIVE_TRANSCODES:-2}
      MAX_WIDTH: ${MAX_WIDTH:-7680}
      MAX_HEIGHT: ${MAX_HEIGHT:-4320}
      MAX_STREAMS: ${MAX_STREAMS:-64}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-86400}
      UPLOAD_RETENTION: ${UPLOAD_RETENTION:-168h}
      VAAPI_DEVICE: ${VAAPI_DEVICE:-/dev/dri/renderD128}
      CGROUP_ROOT: ${CGROUP_ROOT:-}
      REQUIRE_CGROUP: ${REQUIRE_CGROUP:-false}
      REQUIRE_LANDLOCK: ${REQUIRE_LANDLOCK:-true}
    volumes:
      - type: bind
        source: ${DATA_DIR_HOST:-/var/lib/starryeyes}
        target: /var/lib/starryeyes
      - type: bind
        source: ${OUTPUT_DIR_HOST:?set OUTPUT_DIR_HOST to the host output directory}
        target: /mnt/output
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    restart: unless-stopped
