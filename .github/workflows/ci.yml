name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          gofmt_output="$(find . -type f -name '*.go' -not -path './vendor/*' -exec gofmt -l {} +)"
          test -z "$gofmt_output"

      - name: Check Bash syntax
        run: bash -n scripts/upload-directory.sh

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...
