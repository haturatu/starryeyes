name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'cmd/**'
              - 'internal/**'
              - 'scripts/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Format, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          gofmt_output="$(find . -type f -name '*.go' -not -path './vendor/*' -exec gofmt -l {} +)"
          test -z "$gofmt_output"

      - name: Check Bash syntax
        run: bash -n scripts/upload-directory.sh scripts/setup-nvidia-driver.sh scripts/setup-nvidia-container-toolkit.sh scripts/check-nvidia-gpu.sh scripts/start-nvidia.sh
      - name: Check sandbox test syntax
        run: bash -n scripts/test-sandbox-exec.sh

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...
