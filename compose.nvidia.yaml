# Opt-in Compose override for NVIDIA NVENC. Docker Engine needs the NVIDIA
# Container Toolkit installed on the host for `gpus: all` to work.
services:
  starryeyes:
    build:
      target: runtime-nvidia
    gpus: all
    environment:
      # NVENC uses the CUDA driver API during initialization, in addition to
      # the Video Codec SDK and NVML capabilities.
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
